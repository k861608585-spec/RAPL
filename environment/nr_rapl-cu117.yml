# Linux NVIDIA GPU environment for RAPL / NR_RAPL.
# PyTorch 1.13.1 + CUDA 11.7 is compatible with the project's original
# requirements and does not require a locally installed CUDA toolkit.
name: NR-RAPL
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip=23.3
  - git
  - pytorch=1.13.1
  - torchvision=0.14.1
  - pytorch-cuda=11.7
  - pip:
      - numpy==1.23.5
      - pillow==9.5.0
      - pandas==1.5.3
      - scikit-learn==1.2.2
      - timm==0.6.13
      - rich==13.7.1
      - colorlog==6.8.2
      - tqdm==4.66.2
      - nltk==3.8.1
      - PyYAML==6.0.1
      - ftfy==6.1.1
      - regex==2023.12.25
      - git+https://github.com/openai/CLIP.git
